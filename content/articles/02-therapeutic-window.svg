<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="480" fill="#f4f7f8"/>
  <text x="40" y="48" font-size="26" font-weight="bold" fill="#0e2a38">Drug exposure and the therapeutic window</text>
  <text x="40" y="74" font-size="15" fill="#5b6b73">Trough concentration is measured just before the next dose, where exposure is lowest.</text>

  <!-- axes -->
  <line x1="90" y1="400" x2="860" y2="400" stroke="#0e2a38" stroke-width="2"/>
  <line x1="90" y1="120" x2="90" y2="400" stroke="#0e2a38" stroke-width="2"/>
  <text x="70" y="125" font-size="13" fill="#5b6b73" text-anchor="end">conc.</text>
  <text x="855" y="425" font-size="13" fill="#5b6b73" text-anchor="end">time</text>

  <!-- therapeutic window band -->
  <rect x="90" y="250" width="770" height="90" fill="#2e8c9e" opacity="0.15"/>
  <line x1="90" y1="250" x2="860" y2="250" stroke="#2e8c9e" stroke-dasharray="6 4"/>
  <line x1="90" y1="340" x2="860" y2="340" stroke="#2e8c9e" stroke-dasharray="6 4"/>
  <text x="100" y="244" font-size="13" fill="#1f6675">upper threshold (over-exposure / cost)</text>
  <text x="100" y="358" font-size="13" fill="#1f6675">target trough threshold</text>

  <!-- pk sawtooth -->
  <polyline fill="none" stroke="#0e2a38" stroke-width="3"
    points="90,360 150,170 230,330 290,180 370,330 430,190 510,330 570,200 650,330 710,210 790,330"/>

  <!-- trough markers -->
  <circle cx="230" cy="330" r="6" fill="#f2b705"/>
  <circle cx="370" cy="330" r="6" fill="#f2b705"/>
  <circle cx="510" cy="330" r="6" fill="#f2b705"/>
  <circle cx="650" cy="330" r="6" fill="#f2b705"/>
  <text x="650" y="320" font-size="12" fill="#0e2a38" text-anchor="middle">trough</text>

  <!-- sub-therapeutic example -->
  <circle cx="790" cy="370" r="6" fill="#c0392b"/>
  <text x="790" y="392" font-size="12" fill="#c0392b" text-anchor="middle">sub-therapeutic</text>

  <text x="40" y="466" font-size="12" fill="#90a0a6">© 2026 AlpinaBioTech GmbH — original illustration. Conceptual; thresholds are assay- and drug-specific.</text>
</svg>
