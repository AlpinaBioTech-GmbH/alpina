<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="480" fill="#f4f7f8"/>
  <text x="40" y="48" font-size="26" font-weight="bold" fill="#0e2a38">Reactive vs proactive drug monitoring</text>
  <text x="40" y="74" font-size="15" fill="#5b6b73">When the measurement is taken changes how it informs dosing.</text>

  <!-- reactive -->
  <rect x="60" y="120" width="370" height="300" rx="12" fill="#ffffff" stroke="#cdd8db"/>
  <text x="245" y="155" font-size="18" font-weight="bold" fill="#0e2a38" text-anchor="middle">Reactive</text>
  <text x="245" y="180" font-size="13" fill="#5b6b73" text-anchor="middle">triggered by loss of response</text>
  <rect x="90" y="205" width="310" height="40" rx="6" fill="#0e2a38" opacity="0.08"/>
  <text x="245" y="230" font-size="13" fill="#0e2a38" text-anchor="middle">symptoms return / flare</text>
  <text x="245" y="270" font-size="20" fill="#5b6b73" text-anchor="middle">&#8595;</text>
  <rect x="90" y="285" width="310" height="40" rx="6" fill="#2e8c9e" opacity="0.15"/>
  <text x="245" y="310" font-size="13" fill="#0e2a38" text-anchor="middle">measure trough + ADA</text>
  <text x="245" y="350" font-size="20" fill="#5b6b73" text-anchor="middle">&#8595;</text>
  <rect x="90" y="365" width="310" height="40" rx="6" fill="#f2b705" opacity="0.4"/>
  <text x="245" y="390" font-size="13" fill="#0e2a38" text-anchor="middle">optimise, switch in or out of class</text>

  <!-- proactive -->
  <rect x="470" y="120" width="370" height="300" rx="12" fill="#ffffff" stroke="#cdd8db"/>
  <text x="655" y="155" font-size="18" font-weight="bold" fill="#0e2a38" text-anchor="middle">Proactive</text>
  <text x="655" y="180" font-size="13" fill="#5b6b73" text-anchor="middle">scheduled while in remission</text>
  <rect x="500" y="205" width="310" height="40" rx="6" fill="#0e2a38" opacity="0.08"/>
  <text x="655" y="230" font-size="13" fill="#0e2a38" text-anchor="middle">routine timepoint, no symptoms</text>
  <text x="655" y="270" font-size="20" fill="#5b6b73" text-anchor="middle">&#8595;</text>
  <rect x="500" y="285" width="310" height="40" rx="6" fill="#2e8c9e" opacity="0.15"/>
  <text x="655" y="310" font-size="13" fill="#0e2a38" text-anchor="middle">measure trough + ADA</text>
  <text x="655" y="350" font-size="20" fill="#5b6b73" text-anchor="middle">&#8595;</text>
  <rect x="500" y="365" width="310" height="40" rx="6" fill="#f2b705" opacity="0.4"/>
  <text x="655" y="390" font-size="13" fill="#0e2a38" text-anchor="middle">adjust before response is lost</text>

  <text x="40" y="466" font-size="12" fill="#90a0a6">© 2026 AlpinaBioTech GmbH — original illustration. Educational summary; not clinical guidance.</text>
</svg>
