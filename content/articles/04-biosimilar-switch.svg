<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="480" fill="#f4f7f8"/>
  <text x="40" y="48" font-size="26" font-weight="bold" fill="#0e2a38">Monitoring across an originator-to-biosimilar switch</text>
  <text x="40" y="74" font-size="15" fill="#5b6b73">A single validated assay should track the analyte before and after the switch.</text>

  <!-- timeline -->
  <line x1="90" y1="250" x2="860" y2="250" stroke="#0e2a38" stroke-width="2"/>
  <line x1="475" y1="150" x2="475" y2="360" stroke="#f2b705" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="475" y="140" font-size="14" font-weight="bold" fill="#0e2a38" text-anchor="middle">switch point</text>

  <rect x="120" y="210" width="300" height="80" rx="10" fill="#2e8c9e" opacity="0.2" stroke="#2e8c9e"/>
  <text x="270" y="245" font-size="16" font-weight="bold" fill="#0e2a38" text-anchor="middle">Originator biologic</text>
  <text x="270" y="270" font-size="12" fill="#5b6b73" text-anchor="middle">trough levels + ADA monitored</text>

  <rect x="530" y="210" width="300" height="80" rx="10" fill="#7fb2bf" opacity="0.25" stroke="#2e8c9e"/>
  <text x="680" y="245" font-size="16" font-weight="bold" fill="#0e2a38" text-anchor="middle">Biosimilar</text>
  <text x="680" y="270" font-size="12" fill="#5b6b73" text-anchor="middle">same analyte, same assay</text>

  <!-- cross-reactivity note -->
  <rect x="120" y="330" width="710" height="80" rx="10" fill="#ffffff" stroke="#cdd8db"/>
  <text x="140" y="362" font-size="14" font-weight="bold" fill="#0e2a38">Assay continuity matters</text>
  <text x="140" y="386" font-size="13" fill="#5b6b73">Validated drug-level and ADA assays typically cross-react between originator and biosimilar, so trends</text>
  <text x="140" y="404" font-size="13" fill="#5b6b73">stay comparable. Confirm the assay is qualified for each product before reporting.</text>

  <text x="40" y="466" font-size="12" fill="#90a0a6">© 2026 AlpinaBioTech GmbH — original illustration. Conceptual representation.</text>
</svg>
